name: cd

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GOPROXY: https://goproxy.cn,https://proxy.golang.org,direct

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      REGISTRY: ${{ secrets.ACR_REGISTRY }}
      NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      BACKEND_IMAGE: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/opscaptain-backend
      FRONTEND_IMAGE: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/opscaptain-frontend
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_PORT: ${{ secrets.ECS_SSH_PORT }}
      ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
      ECS_SSH_PRIVATE_KEY_BASE64: ${{ secrets.ECS_SSH_PRIVATE_KEY_BASE64 }}
      REMOTE_APP_DIR: ${{ secrets.ECS_APP_DIR }}
      PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
      SECRET_APP_BASE_PATH: ${{ secrets.APP_BASE_PATH }}
      SECRET_ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
      SECRET_CORS_ALLOWED_ORIGIN: ${{ secrets.CORS_ALLOWED_ORIGIN }}
      SECRET_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SECRET_DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
      SECRET_MILVUS_ADDRESS: ${{ secrets.MILVUS_ADDRESS }}
      SECRET_TLS_EMAIL: ${{ secrets.TLS_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize deployment inputs
        run: |
          {
            printf 'REGISTRY=%s\n' "$(printf '%s' "${REGISTRY}" | tr -d '\r\n')"
            printf 'NAMESPACE=%s\n' "$(printf '%s' "${NAMESPACE}" | tr -d '\r\n')"
            printf 'ACR_USERNAME=%s\n' "$(printf '%s' "${ACR_USERNAME}" | tr -d '\r\n')"
            printf 'ACR_PASSWORD=%s\n' "$(printf '%s' "${ACR_PASSWORD}" | tr -d '\r\n')"
            printf 'ECS_HOST=%s\n' "$(printf '%s' "${ECS_HOST}" | tr -d '\r\n')"
            printf 'ECS_USER=%s\n' "$(printf '%s' "${ECS_USER}" | tr -d '\r\n')"
            printf 'ECS_SSH_PORT=%s\n' "$(printf '%s' "${ECS_SSH_PORT}" | tr -d '\r\n')"
            printf 'ECS_SSH_PRIVATE_KEY_BASE64=%s\n' "$(printf '%s' "${ECS_SSH_PRIVATE_KEY_BASE64}" | tr -d '\r\n')"
            printf 'REMOTE_APP_DIR=%s\n' "$(printf '%s' "${REMOTE_APP_DIR}" | tr -d '\r\n')"
          } >> "$GITHUB_ENV"

      - name: Validate deployment secrets
        run: |
          missing=0
          for name in REGISTRY NAMESPACE ACR_USERNAME ACR_PASSWORD ECS_HOST ECS_USER ECS_SSH_PORT REMOTE_APP_DIR PROD_ENV_FILE; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::$name is empty. Check the matching GitHub Actions secret."
              missing=1
            fi
          done
          if [ -z "${ECS_SSH_PRIVATE_KEY_BASE64}" ] && [ -z "${ECS_SSH_PRIVATE_KEY}" ]; then
            echo "::error::Either ECS_SSH_PRIVATE_KEY_BASE64 or ECS_SSH_PRIVATE_KEY must be set."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Log in to Alibaba Cloud Container Registry
        run: echo "${ACR_PASSWORD}" | docker login "${REGISTRY}" -u "${ACR_USERNAME}" --password-stdin

      - name: Build and push backend image
        run: |
          docker build \
            -t "${BACKEND_IMAGE}:${GITHUB_SHA}" \
            -t "${BACKEND_IMAGE}:latest" \
            .
          docker push "${BACKEND_IMAGE}:${GITHUB_SHA}"
          docker push "${BACKEND_IMAGE}:latest"

      - name: Build and push frontend image
        run: |
          docker build \
            -f SuperBizAgentFrontend/Dockerfile \
            -t "${FRONTEND_IMAGE}:${GITHUB_SHA}" \
            -t "${FRONTEND_IMAGE}:latest" \
            SuperBizAgentFrontend
          docker push "${FRONTEND_IMAGE}:${GITHUB_SHA}"
          docker push "${FRONTEND_IMAGE}:latest"

      - name: Prepare SSH client
        run: |
          mkdir -p ~/.ssh
          if [ -n "${ECS_SSH_PRIVATE_KEY_BASE64}" ]; then
            printf '%s' "${ECS_SSH_PRIVATE_KEY_BASE64}" | base64 -d > ~/.ssh/id_rsa
          else
            printf '%s' "${ECS_SSH_PRIVATE_KEY}" | tr -d '\r' > ~/.ssh/id_rsa
          fi
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null
          ssh-keyscan -p "${ECS_SSH_PORT}" "${ECS_HOST}" >> ~/.ssh/known_hosts

      - name: Prepare deployment bundle
        run: |
          trim_value() {
            printf '%s' "${1:-}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          read_env_value() {
            key="$1"
            awk -F= -v key="$key" '
              {
                env_key = $1
                sub(/^[[:space:]]+/, "", env_key)
                sub(/[[:space:]]+$/, "", env_key)
              }
              env_key == key {
                sub(/^[^=]*=/, "", $0)
                print $0
                exit
              }
            ' dist-deploy/.env.production
          }

          require_env_value() {
            key="$1"
            value="$(trim_value "$(read_env_value "$key")")"
            if [ -z "$value" ]; then
              echo "::error::PROD_ENV_FILE is missing required key: $key" >&2
              exit 1
            fi
            printf '%s' "$value"
          }

          normalize_optional_env_value() {
            key="$1"
            fallback="$2"
            value="$(trim_value "$(read_env_value "$key")")"
            case "$value" in
              ""|'${'*'}')
                printf '%s' "$fallback"
                ;;
              *)
                printf '%s' "$value"
                ;;
            esac
          }

          set_env_value_if_missing() {
            key="$1"
            fallback="$2"
            current="$(trim_value "$(read_env_value "$key")")"
            fallback="$(trim_value "$fallback")"
            case "$current" in
              ""|'${'*'}')
                if [ -n "$fallback" ]; then
                  set_env_value "$key" "$fallback"
                fi
                ;;
            esac
          }

          set_env_value() {
            key="$1"
            value="$2"
            tmp_file="dist-deploy/.env.production.tmp"
            grep -v "^[[:space:]]*${key}[[:space:]]*=" dist-deploy/.env.production > "$tmp_file" || true
            printf '%s=%s\n' "$key" "$value" >> "$tmp_file"
            mv "$tmp_file" dist-deploy/.env.production
          }

          delete_env_value() {
            key="$1"
            tmp_file="dist-deploy/.env.production.tmp"
            grep -v "^[[:space:]]*${key}[[:space:]]*=" dist-deploy/.env.production > "$tmp_file" || true
            mv "$tmp_file" dist-deploy/.env.production
          }

          reject_placeholder_secret() {
            key="$1"
            value="$2"
            case "$value" in
              your*|YOUR*|你*|填*|replace-*|example*|'${'*'}'|"<"*">")
                echo "::error::$key in PROD_ENV_FILE still looks like a placeholder."
                exit 1
                ;;
            esac
          }

          mkdir -p dist-deploy
          mkdir -p dist-deploy/prometheus
          mkdir -p dist-deploy/knowledge_seed
          cp deploy/docker-compose.prod.yml dist-deploy/docker-compose.prod.yml
          cp deploy/config.prod.yaml dist-deploy/config.prod.yaml
          cp deploy/remote-deploy.sh dist-deploy/remote-deploy.sh
          cp deploy/local-k8s-log-mcp.py dist-deploy/local-k8s-log-mcp.py
          cp deploy/opscaptain-log-mcp.service dist-deploy/opscaptain-log-mcp.service
          cp deploy/prometheus/prometheus.yml dist-deploy/prometheus/prometheus.yml
          cp deploy/prometheus/opscaptionai-cost-alerts.yml dist-deploy/prometheus/opscaptionai-cost-alerts.yml
          printf '%s' "${PROD_ENV_FILE}" | tr -d '\r' > dist-deploy/.env.production

          for seed_dir in docs res todo Learn/system Learn/operations internal/ai/cmd/knowledge_cmd/docs; do
            if [ -d "$seed_dir" ]; then
              find "$seed_dir" -type f -name '*.md' -print | while IFS= read -r seed_file; do
                target="dist-deploy/knowledge_seed/$seed_file"
                mkdir -p "$(dirname "$target")"
                cp "$seed_file" "$target"
              done
            fi
          done

          set_env_value_if_missing APP_BASE_PATH "$SECRET_APP_BASE_PATH"
          set_env_value_if_missing ARK_API_KEY "$SECRET_ARK_API_KEY"
          set_env_value_if_missing CORS_ALLOWED_ORIGIN "$SECRET_CORS_ALLOWED_ORIGIN"
          set_env_value_if_missing DEEPSEEK_API_KEY "$SECRET_DEEPSEEK_API_KEY"
          set_env_value_if_missing DOMAIN_NAME "$SECRET_DOMAIN_NAME"
          set_env_value_if_missing MILVUS_ADDRESS "$SECRET_MILVUS_ADDRESS"
          set_env_value_if_missing MILVUS_COLLECTION opscaption_knowledge_v2
          set_env_value_if_missing KNOWLEDGE_INDEX_ON_DEPLOY if-missing
          set_env_value_if_missing KNOWLEDGE_INDEX_TIMEOUT_SECONDS 180
          set_env_value_if_missing KNOWLEDGE_INDEX_REQUIRED false
          set_env_value_if_missing MCP_LOG_URL http://host.docker.internal:18088/sse
          set_env_value_if_missing MCP_LOG_HTTP_URL http://host.docker.internal:18088/tools/query_logs
          set_env_value_if_missing TLS_EMAIL "$SECRET_TLS_EMAIL"

          milvus_collection="$(normalize_optional_env_value MILVUS_COLLECTION opscaption_knowledge_v2)"
          if [ "$milvus_collection" = "biz" ]; then
            milvus_collection="opscaption_knowledge_v2"
          fi
          set_env_value MILVUS_COLLECTION "$milvus_collection"

          jaeger_endpoint="$(normalize_optional_env_value JAEGER_ENDPOINT http://jaeger:14268/api/traces)"
          prometheus_address="$(normalize_optional_env_value PROMETHEUS_ADDRESS http://prometheus:9090)"
          redis_address="$(normalize_optional_env_value REDIS_ADDRESS redis:6379)"
          redis_password="$(normalize_optional_env_value REDIS_PASSWORD "")"
          set_env_value JAEGER_ENDPOINT "$jaeger_endpoint"
          set_env_value PROMETHEUS_ADDRESS "$prometheus_address"
          set_env_value REDIS_ADDRESS "$redis_address"
          set_env_value REDIS_PASSWORD "$redis_password"

          domain_name="$(require_env_value DOMAIN_NAME)"
          tls_email="$(require_env_value TLS_EMAIL)"
          cors_allowed_origin="$(require_env_value CORS_ALLOWED_ORIGIN)"
          deepseek_api_key="$(require_env_value DEEPSEEK_API_KEY)"
          ark_api_key="$(require_env_value ARK_API_KEY)"
          milvus_address="$(require_env_value MILVUS_ADDRESS)"
          app_base_path="$(trim_value "$(read_env_value APP_BASE_PATH)")"

          delete_env_value GLM_API_KEY
          delete_env_value SILICONFLOW_API_KEY

          if ! printf '%s' "$tls_email" | grep -Eq '^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$'; then
            echo "::error::TLS_EMAIL in PROD_ENV_FILE is invalid."
            exit 1
          fi

          if ! printf '%s' "$cors_allowed_origin" | grep -Eq '^https?://'; then
            echo "::error::CORS_ALLOWED_ORIGIN must start with http:// or https://."
            exit 1
          fi

          cors_origin_host="$(printf '%s' "$cors_allowed_origin" | sed -E 's#^[a-zA-Z]+://([^/]+).*$#\1#')"
          if [ "$cors_origin_host" != "$domain_name" ]; then
            echo "::error::CORS_ALLOWED_ORIGIN host must exactly match DOMAIN_NAME."
            exit 1
          fi

          if [ -n "$app_base_path" ] && ! printf '%s' "$app_base_path" | grep -Eq '^/[^[:space:]]*$'; then
            echo "::error::APP_BASE_PATH must start with / and contain no spaces."
            exit 1
          fi

          reject_placeholder_secret DEEPSEEK_API_KEY "$deepseek_api_key"
          reject_placeholder_secret ARK_API_KEY "$ark_api_key"

          echo "Deploying DOMAIN_NAME=$domain_name"
          if [ -n "$app_base_path" ]; then
            echo "Deploying APP_BASE_PATH=$app_base_path"
          else
            echo "Deploying APP_BASE_PATH=<root>"
          fi
          echo "Deploying CORS_ALLOWED_ORIGIN=$cors_allowed_origin"
          echo "Deploying MILVUS_ADDRESS=$milvus_address"
          echo "Deploying LLM provider=DeepSeek"
          echo "Deploying embedding provider=Doubao"

          {
            echo "### Deployment Target"
            echo
            printf -- "- DOMAIN_NAME: %s\n" "$domain_name"
            if [ -n "$app_base_path" ]; then
              printf -- "- APP_BASE_PATH: %s\n" "$app_base_path"
            else
              echo "- APP_BASE_PATH: <root>"
            fi
            printf -- "- CORS_ALLOWED_ORIGIN: %s\n" "$cors_allowed_origin"
            printf -- "- MILVUS_ADDRESS: %s\n" "$milvus_address"
            echo "- LLM provider: DeepSeek"
            echo "- Embedding provider: Doubao"
          } >> "$GITHUB_STEP_SUMMARY"

          printf '%s' "${ACR_PASSWORD}" > dist-deploy/.acr-password
          cat <<EOF > dist-deploy/release.env
          BACKEND_IMAGE=${BACKEND_IMAGE}:${GITHUB_SHA}
          FRONTEND_IMAGE=${FRONTEND_IMAGE}:${GITHUB_SHA}
          ACR_REGISTRY=${REGISTRY}
          ACR_USERNAME=${ACR_USERNAME}
          ACR_PASSWORD_FILE=.acr-password
          EOF

      - name: Create remote directory
        run: |
          ssh -p "${ECS_SSH_PORT}" "${ECS_USER}@${ECS_HOST}" "\
            mkdir -p '${REMOTE_APP_DIR}' '${REMOTE_APP_DIR}/prometheus' && \
            rm -rf '${REMOTE_APP_DIR}/knowledge_seed' && \
            mkdir -p '${REMOTE_APP_DIR}/knowledge_seed' && \
            rm -rf '${REMOTE_APP_DIR}/prometheus/prometheus.yml' && \
            rm -rf '${REMOTE_APP_DIR}/prometheus/opscaptionai-cost-alerts.yml'"

      - name: Upload deployment files
        run: |
          scp -P "${ECS_SSH_PORT}" dist-deploy/docker-compose.prod.yml "${ECS_USER}@${ECS_HOST}:${REMOTE_APP_DIR}/docker-compose.prod.yml"
          scp -P "${ECS_SSH_PORT}" dist-deploy/config.prod.yaml "${ECS_USER}@${ECS_HOST}:${REMOTE_APP_DIR}/config.prod.yaml"
          scp -P "${ECS_SSH_PORT}" dist-deploy/remote-deploy.sh "${ECS_USER}@${ECS_HOST}:${REMOTE_APP_DIR}/remote-deploy.sh"
          scp -P "${ECS_SSH_PORT}" dist-deploy/.env.production "${ECS_USER}@${ECS_HOST}:${REMOTE_APP_DIR}/.env.production"
          scp -P "${ECS_SSH_PORT}" dist-deploy/.acr-password "${ECS_USER}@${ECS_HOST}:${REMOTE_APP_DIR}/.acr-password"
          scp -P "${ECS_SSH_PORT}" dist-deploy/release.env "${ECS_USER}@${ECS_HOST}:${REMOTE_APP_DIR}/release.env"
          scp -P "${ECS_SSH_PORT}" dist-deploy/local-k8s-log-mcp.py "${ECS_USER}@${ECS_HOST}:${REMOTE_APP_DIR}/local-k8s-log-mcp.py"
          scp -P "${ECS_SSH_PORT}" dist-deploy/opscaptain-log-mcp.service "${ECS_USER}@${ECS_HOST}:${REMOTE_APP_DIR}/opscaptain-log-mcp.service"
          scp -P "${ECS_SSH_PORT}" -r dist-deploy/knowledge_seed/. "${ECS_USER}@${ECS_HOST}:${REMOTE_APP_DIR}/knowledge_seed/"
          scp -P "${ECS_SSH_PORT}" dist-deploy/prometheus/prometheus.yml "${ECS_USER}@${ECS_HOST}:${REMOTE_APP_DIR}/prometheus/"
          scp -P "${ECS_SSH_PORT}" dist-deploy/prometheus/opscaptionai-cost-alerts.yml "${ECS_USER}@${ECS_HOST}:${REMOTE_APP_DIR}/prometheus/"

      - name: Deploy on ECS
        run: |
          ssh -p "${ECS_SSH_PORT}" "${ECS_USER}@${ECS_HOST}" "\
            cd '${REMOTE_APP_DIR}' && \
            test -f './prometheus/prometheus.yml' && \
            test -f './prometheus/opscaptionai-cost-alerts.yml' && \
            chmod +x ./remote-deploy.sh && \
            APP_DIR='${REMOTE_APP_DIR}' ./remote-deploy.sh"
