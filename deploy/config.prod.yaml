server:
  address: ":8000"

startup:
  require_model_secrets: false

auth:
  enabled: false
  jwt_secret: "${AUTH_JWT_SECRET}"
  token_expiry_hours: 24
  rate_limit_per_minute: 20
  rate_limit_burst: 30

safety:
  prompt_guard:
    enabled: true
  output_filter:
    enabled: true

logging:
  level: "INFO"

tracing:
  enabled: true
  service_name: "oncallai-backend"
  jaeger_endpoint: "${JAEGER_ENDPOINT}"
  sample_ratio: 1.0

debug:
  pprof_enabled: false
  pprof_address: "127.0.0.1:6060"

cache:
  llm_response:
    enabled: true
    ttl_seconds: 300

degradation:
  kill_switch: false
  redis_key: "oncallai:degradation:kill_switch"
  message: "AI capabilities are temporarily degraded. Please retry later."

approval:
  enabled: true
  redis_key_prefix: "oncallai:approval"
  request_ttl_seconds: 86400

cost:
  daily_limit_tokens: "${DAILY_LIMIT_TOKENS}"
  hourly_alert_tokens: "${COST_HOURLY_ALERT_TOKENS}"
  user_daily_alert_tokens: "${COST_USER_DAILY_ALERT_TOKENS}"

file_dir: "/app/docs/knowledge"

upload:
  max_size_mb: 20

cors:
  allowed_origins:
    - "${CORS_ALLOWED_ORIGIN}"

milvus:
  address: "${MILVUS_ADDRESS}"
  collection: "${MILVUS_COLLECTION}"
  index_type: "HNSW"
  metric_type: "IP"
  hnsw:
    m: 16
    ef_construction: 200

chat_model:
  provider: "deepseek"
  model: "deepseek-v4-pro"
  api_key: "${DEEPSEEK_API_KEY}"
  base_url: "https://api.deepseek.com"

chat_model_fast:
  provider: "deepseek"
  model: "deepseek-v4-flash"
  api_key: "${DEEPSEEK_API_KEY}"
  base_url: "https://api.deepseek.com"

llm:
  max_concurrent_calls: 10
  concurrent_wait_timeout_ms: 5000

embedding_model:
  provider: "doubao"
  model: "doubao-embedding-vision-251215"
  api_key: "${ARK_API_KEY}"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  dimension: 2048

memory:
  max_window_size: 20
  max_context_tokens: 4096
  extract_timeout_ms: 1500
  extract_max_concurrency: 8
  extract_wait_timeout_ms: 50
  long_term_max_entries: 1000
  long_term_max_entries_per_session: 100

chat_async:
  enabled: true
  task_ttl_seconds: 86400
  execute_timeout_ms: 120000
  redis_key_prefix: "opscaptionai:chat_task"

context:
  chat_max_history_messages: 10
  chat_max_memory_items: 5
  aiops_max_memory_items: 5
  reporter_max_tool_items: 8
  docs_query_timeout_ms: 5000
  docs_init_failure_ttl_ms: 15000

retriever:
  top_k: 5

rag:
  rewrite_enabled: false
  rerank_enabled: false
  hybrid_dense_top_k: 50
  hybrid_lexical_top_k: 50
  hybrid_fusion_k: 60
  hybrid_candidate_top_k: 20
  hybrid_final_top_k: 5
  hybrid_metadata_boost_enabled: true
  planner:
    enabled: true
    model: "chat_model_fast"
    timeout_ms: 5000
    max_sub_queries: 4
    min_query_length: 15
    exec_timeout_ms: 5000
    decomposition_keywords:
      - "和"
      - "以及"
      - "还有"
      - "跟"
      - "为什么"
      - "怎么回事"
      - "导致"
      - "关系"
  agent:
    enabled: false
    model: "chat_model_fast"
    max_rounds: 3
    confidence_threshold: 0.7
    eval_timeout_ms: 10000
    plan_timeout_ms: 10000
    total_timeout_ms: 30000
    max_total_tokens: 8000

aiops:
  enabled: true
  engine: "plan_execute_replan"
  ledger:
    backend: "redis" # 多实例共享 task/result/trace；artifact 仍使用独立共享存储
    prefix: "opscaption:ai:"
    retention_hours: 24
    max_tasks: 20000
    max_results: 20000
  plan:
    model_path: "chat_model_fast"
    report_timeout_ms: 45000
  gos:
    enabled: false
    evaluation:
      telemetry_profile: "unverified" # 真实环境完成遥测来源核验后才可改为 real
    model_path: "chat_model_fast"
    temperature: 0.8
    max_tokens: 4096
    evidence_max_chars: 8192
    session_max_steps: 5
    max_retrieval_steps: 3
    call_timeout_ms: 30000
    fsm:
      gap_delta: 0.3
      min_support: 2
      max_steps: 3
      min_confidence: 0.7
    confidence:
      support_weight: 0.25
      refute_weight: 0.35
      deduplicate: true
    graph:
      checkpoint_interval: 10
      max_nodes: 256
      max_edges: 512
      max_depth: 4
      max_snapshots: 32
      max_deltas: 10
    structured_cognition:
      enabled: false
      call_timeout_ms: 30000
      max_hypotheses: 4
      max_observations: 8
      max_plan_items: 2
      plan_budget:
        llm_calls: 3
        tool_calls: 2
        rag_calls: 1
        timeout_ms: 30000
        max_retrieval_steps: 2
        max_output_tokens: 1024
    execution:
      max_concurrent_experts: 3
      no_progress_round_limit: 2
    report:
      conflict_strength_threshold: 0.5
      max_evidence_items: 8
      evidence_snippet_max_chars: 512
      max_next_actions: 3
    experts:
      - name: "linux_sre"
        description: "Linux SRE 专家"
        tools: ["query_logs", "query_prometheus_instant", "query_prometheus_alerts", "query_internal_docs"]
        max_retrieval_steps: 3
        budget: {llm_calls: 3, tool_calls: 2, rag_calls: 1, timeout_ms: 30000, max_retrieval_steps: 2, max_output_tokens: 1024}
      - name: "network_sre"
        description: "网络 SRE 专家"
        tools: ["query_logs", "query_prometheus_instant", "query_prometheus_alerts", "query_internal_docs"]
        max_retrieval_steps: 3
        budget: {llm_calls: 3, tool_calls: 2, rag_calls: 1, timeout_ms: 30000, max_retrieval_steps: 2, max_output_tokens: 1024}
      - name: "database_sre"
        description: "数据库 SRE 专家"
        tools: ["query_logs", "query_prometheus_instant", "query_prometheus_alerts", "query_internal_docs"]
        max_retrieval_steps: 3
        budget: {llm_calls: 3, tool_calls: 2, rag_calls: 1, timeout_ms: 30000, max_retrieval_steps: 2, max_output_tokens: 1024}
    state_conversion:
      enabled: false
      max_depth: 2
      tie_epsilon: 0.01
      refinement_rules:
        - parent: "资源耗尽"
          children:
            - {label: "CPU 饱和", score: 0.6, why: "验证 CPU 使用率、负载和节流状态", actionable: true}
            - {label: "内存压力", score: 0.3, why: "验证内存使用、交换和 OOM 事件", actionable: true}
            - {label: "磁盘 IO 饱和", score: 0.1, why: "验证 IO 等待、吞吐和磁盘容量", actionable: true}
        - parent: "网络问题"
          children:
            - {label: "网络延迟升高", score: 0.5, why: "验证链路延迟和跨区 RTT", actionable: true}
            - {label: "网络丢包", score: 0.3, why: "验证重传、丢包率和接口错误", actionable: true}
            - {label: "DNS 解析异常", score: 0.2, why: "验证 DNS 延迟、失败率和解析结果", actionable: true}
        - parent: "配置错误"
          children:
            - {label: "应用配置不一致", score: 0.5, why: "核对当前配置与最近变更", actionable: true}
            - {label: "依赖地址配置错误", score: 0.3, why: "核对依赖端点、凭据引用和环境变量", actionable: true}
            - {label: "发布参数错误", score: 0.2, why: "核对发布清单和运行参数", actionable: true}

multi_agent:
  enabled: false
  data_dir: "/app/var/runtime"
  ai_ops_enabled: false
  agent_timeout_ms: 120000
  metrics_query_timeout_ms: 5000
  knowledge_query_timeout_ms: 5000
  knowledge_init_failure_ttl_ms: 15000
  knowledge_evidence_limit: 5
  log_query_timeout_ms: 3000
  log_evidence_limit: 3

log_topic:
  region: "${LOG_TOPIC_REGION}"
  id: "${LOG_TOPIC_ID}"

mcp:
  log_url: "${MCP_LOG_URL}"
  log_http_url: "${MCP_LOG_HTTP_URL}"
  log_default_window: "30m"
  prefer_http_log_tool: true
  connect_timeout_ms: 10000
  tool_timeout_ms: 5000

mysql:
  dsn: "${MYSQL_DSN}"
  allowed_tables: "${MYSQL_ALLOWED_TABLES}"
  query_timeout_ms: 10000
  max_rows: 100

prometheus:
  address: "${PROMETHEUS_ADDRESS}"
  alerts_max_results: 50
  discovery_timeout_ms: 5000
  discovery_default_window_minutes: 60
  discovery_max_window_minutes: 360
  discovery_max_metrics: 50
  discovery_max_series: 50
  discovery_max_label_values: 20
  instant_query_timeout_ms: 5000
  instant_max_series: 20
  range_query_timeout_ms: 5000
  range_default_window_minutes: 30
  range_max_window_minutes: 360
  range_default_step_seconds: 60
  range_max_series: 20
  range_max_points: 1000

rabbitmq:
  enabled: true
  url: "${RABBITMQ_URL}"
  exchange: "opscaption.events"
  memory_extract_queue: "opscaption.memory.extract"
  memory_extract_consumer_enabled: true
  prefetch: 8
  max_retries: 3
  retry_delay_ms: 2000
  reconnect_delay_ms: 2000
  publish_timeout_ms: 2000
  chat_task_queue: "opscaption.chat.task"
  chat_task_consumer_enabled: true
  chat_task_prefetch: 4
  chat_task_max_retries: 3
  chat_task_retry_delay_ms: 2000
  memory_extract_dedup_ttl_ms: 600000
  memory_extract_dedup_max_entries: 20000

redis:
  default:
    address: "${REDIS_ADDRESS}"
    db: 0
    pass: "${REDIS_PASSWORD}"

change_events:
  enabled: true
  store_backend: "redis"
  max_events: 10000
  recent_buffer_size: 200
  retention_hours: 720
  webhook:
    enabled: true
    json_enabled: true
    sources:
      github:
        enabled: false
      gitlab:
        enabled: false
      argocd:
        enabled: false
  proactive:
    enabled: true
    debounce_seconds: 300
    inspection_timeout_ms: 120000
    require_env: "prod"
    require_risk_level: "medium"
    require_event_types:
      - "deploy"
      - "rollback"
      - "config_update"
      - "scale"
  indexing:
    enabled: true
    source_prefix: "change_event"
  cluster_broadcast:
    enabled: true
    channel: "change_events"
    prefix: "opscaption"
  notifier:
    feishu:
      enabled: true
      webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/6f9ab083-1d7d-427f-84d2-924406bd17ef"
      min_risk_level: "low"
      services: []
      timeout_ms: 5000
      base_url: "http://124.222.57.178"

cmdb:
  enabled: true
  store_path: "var/runtime/cmdb/services.yaml"
  search:
    max_results: 10
  tool:
    timeout_ms: 3000
  jaeger:
    enabled: true
    url: "http://jaeger:16686"
    lookback_hours: 24
    timeout_ms: 5000
    refresh_seconds: 300
