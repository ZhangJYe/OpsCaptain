name: opscaptain-observability

services:
  redis:
    image: redis:latest
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    ports:
      - 127.0.0.1:6380:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - 127.0.0.1:5672:5672
      - 127.0.0.1:15672:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  jaeger:
    image: jaegertracing/all-in-one:1.57
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 127.0.0.1:16686:16686
      - 127.0.0.1:14268:14268
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318

  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command:
      - minio
      - server
      - /minio_data
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  milvus:
    image: milvusdb/milvus:v2.5.10
    platform: linux/amd64
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - 127.0.0.1:19530:19530
      - 127.0.0.1:9091:9091
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.wal-compression
      - --storage.tsdb.retention.time=24h
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./synthetic-alerts.yml:/etc/prometheus/rules/synthetic-alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    depends_on:
      - avalanche

  avalanche:
    image: quay.io/prometheuscommunity/avalanche:v0.7.0
    restart: unless-stopped
    command:
      - --port=9001
      - --gauge-metric-count=8
      - --counter-metric-count=4
      - --histogram-metric-count=2
      - --label-count=2
      - --series-count=5
      - --value-interval=10
      - --series-operation-mode=spike
      - --series-change-interval=120
      - --spike-multiplier=3
      - --const-label=service=checkout
      - --const-label=environment=local
      - --const-label=incident=payment-timeout
    expose:
      - "9001"

  loki:
    image: grafana/loki:3.7.0
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki.yml:/etc/loki/local-config.yaml:ro
    ports:
      - 127.0.0.1:3100:3100

  log-query-adapter:
    image: python:3.12-alpine
    restart: unless-stopped
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command:
      - python3
      - /app/log-adapter.py
      - --backend=loki
      - --loki-url=http://loki:3100
      - --tool-name=query_logs
      - --host=0.0.0.0
      - --port=18088
      - --query-timeout=5
      - --max-window=21600
      - --synthetic-log-interval=1
    volumes:
      - ../local-k8s-log-mcp.py:/app/log-adapter.py:ro
    ports:
      - 127.0.0.1:18088:18088
    depends_on:
      - loki

volumes:
  prometheus-data:
  redis-data:
  rabbitmq-data:
  etcd-data:
  minio-data:
  milvus-data:
