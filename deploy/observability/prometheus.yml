global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/synthetic-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: synthetic-checkout
    static_configs:
      - targets:
          - avalanche:9001

  - job_name: opscaptain-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000
    metric_relabel_configs:
      - action: labeldrop
        regex: session_id
